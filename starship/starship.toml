# Minimal prompt, one line:
#   [exit code] [venv] [host over ssh] [⎇ branch] [wt:repo] [✦1] repo/subdir      [took 5s]
# Only the modules listed in `format` are shown; everything else is off.
add_newline = false
format = """
$status$python$conda$hostname\
$git_branch$git_commit\
${custom.worktree}$jobs$directory"""

# Right side: how long the last command took, only if it was slow.
right_format = "$cmd_duration"

[cmd_duration]
min_time = 3_000
format = "[took $duration]($style)"
style = "dimmed white"

[status]
disabled = false
format = "[$status]($style) "
style = "bold red"

# Only shown when a venv is active (no version, no auto-detection by files).
[python]
format = '[$virtualenv]($style) '
style = "bold green"
detect_extensions = []
detect_files = []
detect_folders = []

[conda]
format = '[$environment]($style) '
style = "bold green"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold purple"

[git_branch]
format = "[⎇ $branch]($style) "
style = "bold yellow"

# Commit hash, only on a detached HEAD (where there's no branch to show).
[git_commit]
format = "[⎇ $hash]($style) "
style = "bold yellow"

# Background jobs (e.g. a suspended vim), shown as ✦ with the count.
[jobs]
format = "[$symbol$number]($style) "
symbol = "✦"
number_threshold = 1
style = "bold cyan"

# Linked worktree: "wt:<main repo>" (worktree dirs are often uninformative names).
# Portable git (no --path-format, which needs git >= 2.31).
[custom.worktree]
require_repo = true
shell = ["sh"]
when = 'test "$(cd "$(git rev-parse --git-dir)" && pwd -P)" != "$(cd "$(git rev-parse --git-common-dir)" && pwd -P)"'
command = 'basename "$(dirname "$(cd "$(git rev-parse --git-common-dir)" && pwd -P)")"'
format = "[wt:$output]($style) "
style = "bold cyan"

# Path: in a repo, just repo/subdir (the full path is in the verbose prompt).
# Outside a repo, the full path.
[directory]
truncation_length = 0
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " ro"
read_only_style = "dimmed"
