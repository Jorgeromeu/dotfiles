onboarding = false

[keys]
# Alt-vim keys to switch panes 
focus_pane_left  = "alt+h"
focus_pane_down  = "alt+j"
focus_pane_up    = "alt+k"
focus_pane_right = "alt+l"

# Alt-arrows to resize panes (tmux: M-arrows)
resize_pane_left  = "alt+left"
resize_pane_down  = "alt+down"
resize_pane_up    = "alt+up"
resize_pane_right = "alt+right"

# simpler split keys 
# current pane's cwd by default ([terminal] new_cwd = "follow")
split_vertical   = "prefix+v"   # side by side
split_horizontal = "prefix+h"   # stacked

# new tab / close pane
new_tab    = "prefix+c"
close_pane = "prefix+x"

# prefix r reloads config 
reload_config = "prefix+r" # (overrides resize mode)
resize_mode   = "prefix+shift+r"

# Alt-t to set the pane title (tmux: M-t)
rename_pane = ["prefix+shift+p", "alt+t"]

# prefix + arrows swaps the current pane with its neighbour
[[keys.command]]
key = "prefix+left"
type = "shell"
command = "herdr pane swap --current --direction left >/dev/null"

[[keys.command]]
key = "prefix+down"
type = "shell"
command = "herdr pane swap --current --direction down >/dev/null"

[[keys.command]]
key = "prefix+up"
type = "shell"
command = "herdr pane swap --current --direction up >/dev/null"

[[keys.command]]
key = "prefix+right"
type = "shell"
command = "herdr pane swap --current --direction right >/dev/null"

# prefix + a toggles sidebar agents: focus (this workspace + needs-attention) <-> all
[[keys.command]]
key = "prefix+a"
type = "shell"
command = "~/.config/herdr/agent-view.sh >/dev/null"

# prefix + shift+b flips the collapsed sidebar between compact rail and fully hidden
[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "~/.config/herdr/sidebar-mode.sh"

[ui]
pane_gaps = false
pane_outer_borders = false
sidebar_start_collapsed = true
pane_scrollbars = false
tab_bar_position = "bottom"
tab_bar_right = [{ type = "hostname" }]   # tmux status-right "#H"
status_indicators = "symbols"
sidebar_collapsed_mode = "hidden"
# show_agent_labels_on_pane_borders = true


# Two rows per agent, no agent name (only claude is used): title, then dimmed location
[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "terminal_title_stripped"], [{ token = "machine", dim = true }, "workspace", "tab", "pane"]]

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false
[theme.custom]
panel_bg = "reset"
# no background behind inactive tabs (tmux-like)
surface0    = "reset"
