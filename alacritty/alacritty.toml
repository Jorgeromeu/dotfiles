# Alacritty config (TOML, Alacritty >= 0.14). Only non-default settings.
# Reference: https://alacritty.org/config-alacritty.html

[general]
live_config_reload = true

[env]
TERM = "alacritty"

[window]
dimensions = { columns = 110, lines = 25 }
padding = { x = 1, y = 1 }
dynamic_padding = true
title = ""
dynamic_title = true
class = { instance = "Alacritty", general = "Alacritty" }

[scrolling]
history = 10000

[font]
normal = { family = "monospace", style = "Medium" }
size = 12
offset = { x = -1, y = -1 }

[cursor]
style = "Underline"
unfocused_hollow = true

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "Copy"

[bell]
animation = "EaseOut"
duration = 1
color = "#ffffff"

# Nord
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#2E3440"
foreground = "#D8DEE9"

[colors.cursor]
text = "#2E3440"
cursor = "#EBCB8B"

[colors.normal]
black = "#3B4252"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#88C0D0"
white = "#E5E9F0"

[colors.bright]
black = "#4C566A"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#8FBCBB"
white = "#ECEFF4"
